<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="stripes" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#f2c200"/>
      <rect x="0" y="0" width="10" height="20" fill="#ffffff"/>
    </pattern>
    <clipPath id="innerCircleClip">
      <circle cx="200" cy="210" r="82"/>
    </clipPath>
    <path id="bottomArc" d="M 68,220 A 132,132 0 0,0 332,220" fill="none"/>
  </defs>

  <!-- CERCHIO GIALLO ESTERNO -->
  <circle cx="200" cy="200" r="198" fill="#f2c200"/>

  <!-- ANELLO NERO SPESSO -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#111111" stroke-width="28"/>

  <!-- LETTERA F -->
  <text x="115" y="148" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="100" fill="#111111">F</text>

  <!-- LETTERA C -->
  <text x="285" y="148" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="100" fill="#111111">C</text>

  <!-- ISTRIA curvo in basso -->
  <text font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="52" fill="#111111" letter-spacing="8">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">ISTRIA</textPath>
  </text>

  <!-- CERCHIO INTERNO strisce -->
  <circle cx="200" cy="210" r="82" fill="url(#stripes)"/>
  <circle cx="200" cy="210" r="82" fill="none" stroke="#111111" stroke-width="9"/>

  <!-- GAZZA — profilo sinistro, ali aperte verso l'alto -->
  <g fill="#111111">
    <!-- corpo -->
    <path d="M178 235 C166 226 160 212 163 199 C166 186 177 179 190 180 C203 181 212 189 213 201 C215 213 207 226 196 232 C201 227 204 217 200 210 C196 203 188 201 183 204 C177 207 174 215 175 223 C176 229 178 235 178 235Z"/>
    <!-- pancia gialla -->
    <path d="M176 222 C176 213 181 206 187 204 C193 202 201 205 204 212 C207 219 204 228 198 233 C191 235 181 233 177 228Z" fill="#f2c200"/>
    <!-- ala sinistra -->
    <path d="M173 212 C167 206 153 194 139 186 C131 181 120 177 112 176 C118 181 127 186 131 191 C122 186 111 183 104 183 C111 189 123 194 129 200 C119 197 109 196 103 197 C111 203 124 207 132 210 C140 214 153 216 163 215 C170 214 174 213 173 212Z"/>
    <!-- piume ala sx -->
    <path d="M129 210 C122 203 118 194 121 186 C124 193 126 202 129 210Z" fill="#2a2a2a"/>
    <path d="M138 213 C130 205 126 195 130 187 C133 195 135 204 138 213Z" fill="#2a2a2a"/>
    <!-- ala destra -->
    <path d="M215 212 C221 206 235 194 249 186 C257 181 268 177 276 176 C270 181 261 186 257 191 C266 186 277 183 284 183 C277 189 265 194 259 200 C269 197 279 196 285 197 C277 203 264 207 256 210 C248 214 235 216 225 215 C218 214 214 213 215 212Z"/>
    <!-- piume ala dx -->
    <path d="M259 210 C266 203 270 194 267 186 C264 193 262 202 259 210Z" fill="#2a2a2a"/>
    <path d="M250 213 C258 205 262 195 258 187 C255 195 253 204 250 213Z" fill="#2a2a2a"/>
    <!-- coda lunga destra -->
    <path d="M213 234 C222 239 238 248 252 260 C260 269 264 280 262 290 C256 279 246 268 235 258 C240 269 243 282 242 293 C236 279 233 264 224 252 C220 245 216 238 213 234Z"/>
    <!-- testa -->
    <circle cx="162" cy="194" r="19"/>
    <!-- occhio -->
    <circle cx="155" cy="190" r="4" fill="#f2c200"/>
    <circle cx="155" cy="190" r="2.2" fill="#111111"/>
    <circle cx="154" cy="189" r="0.8" fill="#ffffff"/>
    <!-- becco -->
    <path d="M146 193 L132 190 L133 196 L146 196Z"/>
    <line x1="133" y1="193" x2="146" y2="193" stroke="#f2c200" stroke-width="1.8"/>
  </g>
