<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="stripes" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f2c200"/>
      <rect width="6" height="12" fill="#ffffff"/>
    </pattern>
    <clipPath id="innerClip"><circle cx="100" cy="114" r="34"/></clipPath>
  </defs>

  <!-- disco giallo -->
  <circle cx="100" cy="100" r="99" fill="#f2c200"/>
  <!-- anello nero spesso -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#111111" stroke-width="13"/>

  <!-- lettere F C -->
  <text x="68"  y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="46" fill="#111111">F</text>
  <text x="132" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="46" fill="#111111">C</text>
  <!-- ISTRIA -->
  <text x="100" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-style="italic" font-size="32" letter-spacing="2" fill="#111111">ISTRIA</text>

  <!-- cerchio centrale a strisce -->
  <circle cx="100" cy="114" r="34" fill="url(#stripes)"/>
  <g clip-path="url(#innerClip)">
    <!-- gazza in volo (testa a sinistra, ali aperte verso l'alto, coda lunga) -->
    <path fill="#111111" d="M88 116
      C84 110 84 104 88 100
      C92 105 95 108 99 109
      C104 95 116 86 132 82
      C124 90 118 98 116 106
      C124 99 132 95 141 95
      C133 101 126 108 121 116
      C127 113 134 112 140 114
      C131 118 123 122 117 128
      L150 150
      L118 134
      C114 140 107 143 100 142
      C112 138 116 130 113 122
      C108 126 100 127 92 124
      C97 123 100 120 100 117
      C96 119 91 119 88 116 Z"/>
    <!-- testa -->
    <circle cx="86" cy="108" r="7.5" fill="#111111"/>
    <!-- occhio -->
    <circle cx="84" cy="106" r="1.8" fill="#f2c200"/>
    <!-- becco -->
    <path fill="#111111" d="M80 108 L70 106 L70 110 L80 111 Z"/>
  </g>
  <!-- bordo cerchio centrale -->
  <circle cx="100" cy="114" r="34" fill="none" stroke="#111111" stroke-width="5"/>
</svg>
