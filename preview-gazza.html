<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Preview gazza con palloni</title>
<style>
  body { font-family: Arial, sans-serif; background: #e8e8e8; padding: 40px; display:flex; gap:40px; flex-wrap:wrap; align-items:flex-start; }
  .box { background:#fff; border-radius:20px; padding:30px; box-shadow:0 4px 16px #0002; text-align:center; }
  .label { font-size:13px; color:#888; margin-top:12px; font-weight:600; }
  h1 { width:100%; font-size:20px; color:#111; margin-bottom:0; }
</style>
</head>
<body>
<h1>Gazza con pallone da calcio e pallavolo</h1>

<!-- VERSIONE 1: gazza di profilo con palloni ai piedi -->
<div class="box">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="180" height="180">
  <defs>
    <clipPath id="ring1"><circle cx="110" cy="110" r="92"/></clipPath>
  </defs>
  <!-- sfondo giallo -->
  <circle cx="110" cy="110" r="108" fill="#f2c200"/>
  <!-- anello nero -->
  <circle cx="110" cy="110" r="92" fill="none" stroke="#111" stroke-width="13"/>

  <!-- CODA lunga -->
  <path d="M138 130 C150 140 168 158 178 172 C170 160 155 142 142 132Z" fill="#111"/>
  <path d="M135 135 C145 148 160 168 168 185 C161 170 148 150 138 138Z" fill="#1a1a1a"/>

  <!-- CORPO principale (nero) -->
  <ellipse cx="112" cy="118" rx="32" ry="22" fill="#111"/>
  <!-- PANCIA bianca -->
  <ellipse cx="108" cy="122" rx="19" ry="15" fill="#f5f5f5"/>

  <!-- ALI aperte -->
  <!-- ala sinistra (verso su) -->
  <path d="M95 108 C88 90 80 72 72 62 C82 70 94 88 100 106Z" fill="#111"/>
  <path d="M98 106 C94 88 90 70 86 58 C93 68 100 88 104 106Z" fill="#222"/>
  <!-- ala destra -->
  <path d="M128 108 C136 92 148 78 158 68 C148 78 136 94 128 112Z" fill="#111"/>
  <path d="M124 110 C130 95 140 82 148 74 C140 84 130 98 124 112Z" fill="#222"/>

  <!-- TESTA (nera, tonda) -->
  <circle cx="86" cy="96" r="18" fill="#111"/>
  <!-- BIANCO guancia -->
  <ellipse cx="84" cy="100" rx="9" ry="7" fill="#f0f0f0"/>
  <!-- OCCHIO -->
  <circle cx="80" cy="93" r="4" fill="#f2c200"/>
  <circle cx="80" cy="93" r="2.2" fill="#111"/>
  <circle cx="79" cy="92" r="0.8" fill="#fff"/>
  <!-- BECCO -->
  <path d="M69 95 L58 92 L58 98 L69 98Z" fill="#111"/>
  <line x1="58" y1="95" x2="69" y2="95" stroke="#f2c200" stroke-width="1"/>

  <!-- ZAMPE -->
  <line x1="100" y1="136" x2="94" y2="152" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="138" x2="118" y2="154" stroke="#111" stroke-width="3" stroke-linecap="round"/>

  <!-- PALLONE DA CALCIO (sotto sinistra) -->
  <circle cx="84" cy="168" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- pentagoni calcio -->
  <polygon points="84,154 88,159 86,165 82,165 80,159" fill="#111"/>
  <polygon points="70,162 76,159 80,165 78,170 72,170" fill="#111"/>
  <polygon points="98,162 92,159 88,165 90,170 96,170" fill="#111"/>
  <polygon points="72,174 78,170 82,176 80,182 74,180" fill="#111"/>
  <polygon points="96,174 90,170 88,176 92,182 96,178" fill="#111"/>

  <!-- PALLONE DA PALLAVOLO (sotto destra) -->
  <circle cx="136" cy="168" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- strisce pallavolo -->
  <path d="M122 162 Q136 154 150 162" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M120 170 Q136 178 152 170" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M136 152 Q144 168 136 184" fill="none" stroke="#2471a3" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M120 162 Q130 168 120 175" fill="none" stroke="#2471a3" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M152 162 Q142 168 152 175" fill="none" stroke="#2471a3" stroke-width="1.5" stroke-linecap="round"/>
</svg>
<div class="label">Versione 1 — Gazza con palloni ai piedi</div>
</div>

<!-- VERSIONE 2: gazza araldica con ali aperte che regge i palloni -->
<div class="box">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="180" height="180">
  <defs>
    <clipPath id="ring2"><circle cx="110" cy="110" r="92"/></clipPath>
  </defs>
  <circle cx="110" cy="110" r="108" fill="#f2c200"/>
  <circle cx="110" cy="110" r="92" fill="none" stroke="#111" stroke-width="13"/>

  <!-- ALI aperte stile araldico -->
  <!-- ala sinistra -->
  <path d="M95 115 C85 100 68 80 52 65 C60 70 68 80 72 90 C62 78 52 68 46 60 C56 70 64 85 70 98 C60 88 50 78 44 70 C54 82 64 98 72 110Z" fill="#111"/>
  <!-- piume sinistra -->
  <path d="M72 110 C68 98 64 85 68 74 C70 82 72 92 76 102Z" fill="#333"/>
  <path d="M76 108 C74 96 73 83 78 72 C79 80 80 90 82 102Z" fill="#2a2a2a"/>

  <!-- ala destra -->
  <path d="M125 115 C135 100 152 80 168 65 C160 70 152 80 148 90 C158 78 168 68 174 60 C164 70 156 85 150 98 C160 88 170 78 176 70 C166 82 156 98 148 110Z" fill="#111"/>
  <path d="M148 110 C152 98 156 85 152 74 C150 82 148 92 144 102Z" fill="#333"/>
  <path d="M144 108 C146 96 147 83 142 72 C141 80 140 90 138 102Z" fill="#2a2a2a"/>

  <!-- CORPO -->
  <ellipse cx="110" cy="118" rx="26" ry="20" fill="#111"/>
  <!-- pancia bianca -->
  <ellipse cx="110" cy="121" rx="16" ry="13" fill="#f0f0f0"/>

  <!-- CODA -->
  <path d="M100 132 C98 145 96 162 95 175 C98 165 102 150 106 138Z" fill="#111"/>
  <path d="M110 134 C110 148 110 164 110 178 C112 165 112 150 112 138Z" fill="#1a1a1a"/>
  <path d="M120 132 C122 145 124 162 125 175 C122 165 118 150 114 138Z" fill="#111"/>

  <!-- TESTA -->
  <circle cx="110" cy="90" r="17" fill="#111"/>
  <ellipse cx="110" cy="95" rx="8" ry="6" fill="#f0f0f0"/>
  <!-- occhio sx -->
  <circle cx="104" cy="87" r="3.5" fill="#f2c200"/>
  <circle cx="104" cy="87" r="2" fill="#111"/>
  <circle cx="103" cy="86" r="0.7" fill="#fff"/>
  <!-- occhio dx -->
  <circle cx="116" cy="87" r="3.5" fill="#f2c200"/>
  <circle cx="116" cy="87" r="2" fill="#111"/>
  <circle cx="115" cy="86" r="0.7" fill="#fff"/>
  <!-- becco -->
  <path d="M104 96 L110 103 L116 96Z" fill="#111"/>
  <line x1="110" y1="96" x2="110" y2="103" stroke="#f2c200" stroke-width="1"/>

  <!-- ARTIGLI che reggono i palloni -->
  <line x1="96" y1="134" x2="80" y2="155" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="124" y1="134" x2="140" y2="155" stroke="#111" stroke-width="3" stroke-linecap="round"/>

  <!-- PALLONE CALCIO (sinistra) -->
  <circle cx="74" cy="168" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <polygon points="74,154 78,159 76,164 71,164 69,159" fill="#111"/>
  <polygon points="60,162 66,159 71,164 68,170 62,168" fill="#111"/>
  <polygon points="88,162 82,159 76,164 79,170 85,168" fill="#111"/>
  <polygon points="64,174 68,170 72,175 70,181 64,179" fill="#111"/>
  <polygon points="85,174 81,170 77,175 79,181 84,178" fill="#111"/>

  <!-- PALLONE VOLLEY (destra) -->
  <circle cx="146" cy="168" r="15" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M132 162 Q146 154 160 162" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M131 170 Q146 178 161 170" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M146 153 Q154 168 146 183" fill="none" stroke="#2471a3" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M131 163 Q140 168 131 175" fill="none" stroke="#2471a3" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M161 163 Q152 168 161 175" fill="none" stroke="#2471a3" stroke-width="1.5" stroke-linecap="round"/>
</svg>
<div class="label">Versione 2 — Gazza araldica (frontale)</div>
</div>

<!-- VERSIONE 3: stilizzata minimal, gazza come simbolo con palloni -->
<div class="box">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="180" height="180">
  <circle cx="110" cy="110" r="108" fill="#111"/>
  <circle cx="110" cy="110" r="92" fill="none" stroke="#f2c200" stroke-width="8"/>

  <!-- corpo gazza stilizzato (nero su nero, bordo giallo) -->
  <!-- CORPO ovale con bordo giallo -->
  <ellipse cx="110" cy="112" rx="30" ry="22" fill="#1a1a1a" stroke="#f2c200" stroke-width="2"/>
  <!-- pancia bianca -->
  <ellipse cx="110" cy="116" rx="18" ry="14" fill="#fff"/>

  <!-- ALI stilizzate come frecce/virgole -->
  <path d="M82 108 C72 90 62 70 58 55 C66 68 78 88 86 108Z" fill="#f2c200"/>
  <path d="M138 108 C148 90 158 70 162 55 C154 68 142 88 134 108Z" fill="#f2c200"/>

  <!-- CODA stilizzata -->
  <path d="M98 128 C92 148 86 168 82 185 C88 168 96 148 104 130Z" fill="#f2c200"/>
  <path d="M122 128 C128 148 134 168 138 185 C132 168 124 148 116 130Z" fill="#f2c200"/>
  <path d="M110 130 L110 185" stroke="#f2c200" stroke-width="5" stroke-linecap="round"/>

  <!-- TESTA -->
  <circle cx="110" cy="86" r="18" fill="#1a1a1a" stroke="#f2c200" stroke-width="2"/>
  <!-- cresta -->
  <path d="M106 69 C108 60 112 58 114 69" fill="none" stroke="#f2c200" stroke-width="2.5" stroke-linecap="round"/>
  <!-- occhi gialli -->
  <circle cx="103" cy="84" r="4" fill="#f2c200"/>
  <circle cx="103" cy="84" r="2" fill="#111"/>
  <circle cx="117" cy="84" r="4" fill="#f2c200"/>
  <circle cx="117" cy="84" r="2" fill="#111"/>
  <!-- becco -->
  <path d="M104 92 L110 100 L116 92Z" fill="#f2c200"/>

  <!-- PALLONE CALCIO stilizzato -->
  <circle cx="78" cy="158" r="16" fill="#fff"/>
  <polygon points="78,143 82,149 80,155 74,155 72,149" fill="#111"/>
  <polygon points="64,152 70,149 74,155 72,161 66,158" fill="#111"/>
  <polygon points="92,152 86,149 80,155 83,161 89,158" fill="#111"/>
  <polygon points="66,164 72,161 76,166 74,172 68,170" fill="#111"/>
  <polygon points="90,164 84,161 80,166 83,172 88,170" fill="#111"/>
  <circle cx="78" cy="158" r="16" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- PALLONE VOLLEY stilizzato -->
  <circle cx="142" cy="158" r="16" fill="#fff"/>
  <path d="M128 152 Q142 144 156 152" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M127 160 Q142 168 157 160" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M142 142 Q150 158 142 174" fill="none" stroke="#2471a3" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="142" cy="158" r="16" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- testo ISTRIA in fondo -->
  <text x="110" y="206" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="14" letter-spacing="4" fill="#f2c200">ISTRIA</text>
</svg>
<div class="label">Versione 3 — Stilizzata minimal (sfondo nero)</div>
</div>

</body>
</html>
