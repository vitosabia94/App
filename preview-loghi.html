<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Preview loghi</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 30px; }
  h2 { color: #1a1a2e; margin-top: 32px; border-bottom: 2px solid #f2c200; padding-bottom: 6px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin: 20px 0; }
  .box { background: #fff; border-radius: 16px; padding: 24px 20px 16px; box-shadow: 0 2px 12px #0001; text-align: center; min-width: 130px; }
  .label { font-size: 12px; color: #888; margin-top: 10px; }
  .pill { display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700;margin:4px; }
</style>
</head>
<body>

<h2>Nuove proposte logo</h2>
<div class="row">

  <!-- D: cerchio classico con banda nera orizzontale -->
  <div class="box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="110" height="110">
      <circle cx="100" cy="100" r="98" fill="#f2c200"/>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#111" stroke-width="12"/>
      <!-- fascia nera centrale -->
      <rect x="16" y="83" width="168" height="34" fill="#111"/>
      <text x="100" y="107" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="22" letter-spacing="5" fill="#f2c200">ISTRIA</text>
      <!-- FC sopra -->
      <text x="66" y="75" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="38" fill="#111">F</text>
      <text x="134" y="75" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="38" fill="#111">C</text>
      <!-- anno sotto -->
      <text x="100" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="2" fill="#111">EST. 2020</text>
    </svg>
    <div class="label">D — Fascia classica</div>
  </div>

  <!-- E: scudo moderno -->
  <div class="box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="96" height="110">
      <!-- scudo -->
      <path d="M100 8 L192 42 L192 125 C192 178 100 222 100 222 C100 222 8 178 8 125 L8 42 Z" fill="#111"/>
      <path d="M100 20 L182 50 L182 125 C182 172 100 212 100 212 C100 212 18 172 18 125 L18 50 Z" fill="#f2c200"/>
      <!-- banda nera orizzontale -->
      <rect x="18" y="100" width="164" height="36" fill="#111"/>
      <text x="100" y="124" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="18" letter-spacing="3" fill="#f2c200">ISTRIA</text>
      <!-- FC -->
      <text x="65" y="92" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="36" fill="#111">F</text>
      <text x="135" y="92" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="36" fill="#111">C</text>
      <!-- stella -->
      <text x="100" y="175" text-anchor="middle" font-size="20">⭐</text>
    </svg>
    <div class="label">E — Scudo moderno</div>
  </div>

  <!-- F: minimal bold typography -->
  <div class="box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="110" height="110">
      <circle cx="100" cy="100" r="98" fill="#111"/>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#f2c200" stroke-width="8"/>
      <!-- FC grande -->
      <text x="100" y="95" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="56" fill="#f2c200">FC</text>
      <!-- linea -->
      <rect x="40" y="102" width="120" height="3" fill="#f2c200" rx="1.5"/>
      <!-- ISTRIA -->
      <text x="100" y="135" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="24" letter-spacing="5" fill="#fff">ISTRIA</text>
    </svg>
    <div class="label">F — Bold minimal</div>
  </div>

  <!-- G: cerchio quarti bicolore -->
  <div class="box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="110" height="110">
      <defs><clipPath id="cc"><circle cx="100" cy="100" r="84"/></clipPath></defs>
      <circle cx="100" cy="100" r="98" fill="#f2c200"/>
      <circle cx="100" cy="100" r="84" fill="#f2c200"/>
      <!-- quarti alternati neri -->
      <g clip-path="url(#cc)">
        <path d="M100 100 L184 100 A84 84 0 0 0 100 16 Z" fill="#111"/>
        <path d="M100 100 L16 100 A84 84 0 0 0 100 184 Z" fill="#111"/>
      </g>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#111" stroke-width="10"/>
      <!-- FC -->
      <text x="60" y="88" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="32" fill="#f2c200">F</text>
      <text x="140" y="118" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="32" fill="#f2c200">C</text>
      <!-- ISTRIA cerchio -->
      <text x="100" y="160" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="16" letter-spacing="3" fill="#111">ISTRIA</text>
      <text x="100" y="55" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="16" letter-spacing="3" fill="#f2c200">ISTRIA</text>
    </svg>
    <div class="label">G — Quarti bicolore</div>
  </div>

  <!-- H: cerchio con onde -->
  <div class="box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="110" height="110">
      <defs><clipPath id="cw"><circle cx="100" cy="100" r="84"/></clipPath></defs>
      <circle cx="100" cy="100" r="98" fill="#f2c200"/>
      <circle cx="100" cy="100" r="84" fill="#111"/>
      <g clip-path="url(#cw)">
        <!-- onde gialle -->
        <path d="M0 110 Q25 95 50 110 Q75 125 100 110 Q125 95 150 110 Q175 125 200 110 L200 200 L0 200Z" fill="#f2c200"/>
      </g>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#f2c200" stroke-width="6"/>
      <text x="100" y="90" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="46" fill="#f2c200">FC</text>
      <text x="100" y="168" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="16" letter-spacing="4" fill="#111">ISTRIA</text>
    </svg>
    <div class="label">H — Onda</div>
  </div>

</div>

<h2>Badge squadra — Opzione 1 confermata ✅</h2>
<div class="row">
  <div class="box">
    <span class="pill" style="background:#f2c200;color:#111">⚽ Calcio</span>
    <span class="pill" style="background:#f2c200;color:#111">🏐 Volley</span>
    <div class="label">Applicato nell'app</div>
  </div>
</div>

<h2>Badge giocatore — Pallina della squadra</h2>
<div class="row">
  <div class="box">
    <div style="font-size:15px;color:#333">Mario Rossi <span style="font-size:18px">⚽</span></div>
    <div style="font-size:15px;color:#333;margin-top:8px">Anna Bianchi <span style="font-size:18px">🏐</span></div>
    <div class="label">Applicato nell'app</div>
  </div>
</div>

</body>
</html>
